<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/guard.js"></script>
</head>
<body>
    <!-- Navbar (P0) -->
    <header class="navbar">
        <div class="navbar-container">
            <a href="dashboard.html" class="logo">10X CRM</a>
            <nav class="nav-links">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="clients.html" class="nav-item">Clients</a>
                <a href="profile.html" class="nav-item active">Profile</a>
            </nav>
            <div class="nav-actions">
                <button id="theme-toggle-btn" class="btn btn-secondary btn-icon-text">🌓 Theme</button>
                <button onclick="logout()" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container max-width-small">
        
        <!-- P5.1 - ინფორმაციის ბლოკი -->
        <div class="profile-card flex-align-center">
            <div id="user-initials-avatar" class="initials-avatar">--</div>
            <div class="profile-info">
                <h3 id="profile-display-name">--</h3>
                <p id="profile-display-email" class="text-muted">--</p>
                <p id="profile-display-meta" class="text-small text-muted">--</p>
            </div>
        </div>

        <!-- P5.2 - პროფილის რედაქტირება (A. Save Changes) -->
        <div class="profile-section-card">
            <h3>Edit Profile</h3>
            <form id="edit-profile-form" novalidate>
                <div class="form-group">
                    <label for="profile-fullName">Full Name *</label>
                    <input type="text" id="profile-fullName" placeholder="Full Name">
                </div>

                <div class="form-group">
                    <label for="profile-company">Company</label>
                    <input type="text" id="profile-company" placeholder="Company (optional)">
                </div>

                <button type="submit" class="btn btn-primary">A. Save Changes</button>
            </form>
        </div>

        <!-- P5.3 - პაროლის შეცვლა (B. Change Password) -->
        <div class="profile-section-card">
            <h3>Change Password</h3>
            <form id="change-password-form" novalidate>
                <div class="form-group">
                    <label for="current-password">Current Password *</label>
                    <input type="password" id="current-password" placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="new-password">New Password *</label>
                    <input type="password" id="new-password" placeholder="Min. 8 chars, letter & number">
                </div>

                <div class="form-group">
                    <label for="confirm-new-password">Confirm New Password *</label>
                    <input type="password" id="confirm-new-password" placeholder="Repeat new password">
                </div>

                <button type="submit" class="btn btn-primary">B. Change Password</button>
            </form>
        </div>

        <!-- P5.4 - მონაცემების მართვა (C. Reset CRM Data) -->
        <div class="profile-section-card border-danger">
            <h3>Data</h3>
            <button id="reset-crm-data-btn" class="btn btn-danger">C. Reset CRM Data</button>
        </div>

    </main>

    <div id="toast-container" class="toast-container"></div>
    <script src="js/profile.js"></script>
</body>
</html>
