<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Clients</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/guard.js"></script>
</head>
<body>
    <header class="navbar">
        <div class="navbar-container">
            <a href="dashboard.html" class="logo">10X CRM</a>
            <nav class="nav-links">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="clients.html" class="nav-item active">Clients</a>
                <a href="profile.html" class="nav-item">Profile</a>
            </nav>
            <div class="nav-actions">
                <button id="theme-toggle-btn" class="btn btn-secondary btn-icon-text">🌓 Theme</button>
                <button onclick="logout()" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Header & Add Button -->
        <div class="page-header flex-between">
            <h2>Clients</h2>
            <button id="open-add-modal-btn" class="btn btn-primary">+ Add Client</button>
        </div>

        <!-- Toolbar: Search, Chips & Sort -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Search by name or company...">
            </div>

            <div class="filter-chips" id="filter-chips">
                <button class="chip active" data-status="All">All</button>
                <button class="chip" data-status="Lead">Lead</button>
                <button class="chip" data-status="Contacted">Contacted</button>
                <button class="chip" data-status="Won">Won</button>
                <button class="chip" data-status="Lost">Lost</button>
            </div>

            <div class="sort-box">
                <select id="sort-select" aria-label="Sort Clients">
                    <option value="newest">Newest first</option>
                    <option value="name_asc">Name A → Z</option>
                    <option value="deal_desc">Deal value: high → low</option>
                </select>
            </div>
        </div>

        <!-- Clients List Container -->
        <div id="clients-list-container" class="clients-list-grid">
            <div class="loading-state">Loading clients...</div>
        </div>
    </main>

    <!-- Modal 1: Add Client -->
    <div id="add-client-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Client</h3>
                <button id="close-add-modal-btn" class="close-btn">×</button>
            </div>

            <form id="add-client-form" novalidate>
                <div class="form-group">
                    <label for="client-name">Name *</label>
                    <input type="text" id="client-name" placeholder="Emily Johnson">
                </div>

                <div class="form-group">
                    <label for="client-email">Email *</label>
                    <input type="email" id="client-email" placeholder="emily@example.com">
                </div>

                <div class="form-group">
                    <label for="client-phone">Phone</label>
                    <input type="text" id="client-phone" placeholder="+1 555-0199">
                </div>

                <div class="form-group">
                    <label for="client-company">Company</label>
                    <input type="text" id="client-company" placeholder="Acme Inc.">
                </div>

                <div class="form-group">
                    <label for="client-deal-value">Deal Value ($) *</label>
                    <input type="number" id="client-deal-value" placeholder="5000">
                </div>

                <div class="form-group">
                    <label for="client-status">Status *</label>
                    <select id="client-status">
                        <option value="Lead" selected>Lead</option>
                        <option value="Contacted">Contacted</option>
                        <option value="Won">Won</option>
                        <option value="Lost">Lost</option>
                    </select>
                </div>

                <div class="modal-footer">
                    <button type="button" id="cancel-add-modal-btn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Client</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 2: Client Details & Notes -->
    <div id="client-details-modal" class="modal-overlay">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="detail-client-name">Client Details</h3>
                <button id="close-details-modal-btn" class="close-btn">×</button>
            </div>

            <div class="details-body">
                <div class="details-info-header">
                    <img id="detail-avatar" src="" alt="Avatar" class="avatar-large">
                    <div>
                        <h4 id="detail-name-company">--</h4>
                        <p id="detail-email-phone" class="text-muted">--</p>
                        <p class="text-small"><strong id="detail-deal-value">$0</strong> • <span id="detail-since">Client since --</span></p>
                    </div>
                </div>

                <hr class="divider">

                <div class="notes-section">
                    <h4>Notes & Interaction History</h4>
                    <div id="notes-list" class="notes-list">
                        <p class="text-muted text-small">No notes yet.</p>
                    </div>

                    <div class="add-note-box">
                        <input type="text" id="new-note-input" placeholder="Write a note...">
                        <button id="add-note-btn" class="btn btn-primary">Add note</button>
                    </div>
                </div>

                <div class="reminder-section">
                    <button id="remind-btn" class="btn btn-secondary btn-full">⏰ Remind me in 1 min</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="js/clients.js"></script>
</body>
</html>
