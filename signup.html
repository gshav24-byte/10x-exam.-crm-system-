<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10X CRM - Create Account</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/guard.js"></script>
  </head>
  <body class="auth-body">
    <main class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Create your account</h2>
          <p>Start managing your client pipelines today</p>
        </div>

        <form id="signup-form" novalidate>
          <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" placeholder="Nino Beridze" />
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" placeholder="nino@example.com" />
          </div>

          <div class="form-group">
            <label for="company">Company (optional)</label>
            <input type="text" id="company" placeholder="Company (optional)" />
          </div>

          <div class="form-group">
            <label for="password">Password *</label>
            <input
              type="password"
              id="password"
              placeholder="Min. 8 chars, letter & number"
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password *</label>
            <input
              type="password"
              id="confirmPassword"
              placeholder="Repeat password"
            />
          </div>

          <button type="submit" class="btn btn-primary btn-full">
            Create Account
          </button>
        </form>

        <div class="auth-footer">
          <p>Already have an account? <a href="index.html">Log in</a></p>
        </div>
      </div>
    </main>

    <div id="toast-container" class="toast-container"></div>
    <script src="js/auth.js"></script>
  </body>
</html>
